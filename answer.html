<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Answer from Notes</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="app-page"><header class="appbar"><a class="app-brand" href="{{ url_for('home') }}">✦ AI Study Buddy</a><span>Created by Ruksar Banu</span></header>
<main class="page-wrap content-page"><span class="eyebrow">ASK YOUR NOTES</span><h1>Question & answer</h1><form class="ask-form" action="{{ url_for('ask') }}" method="post"><label for="question">Your question</label><input id="question" name="question" type="text" value="{{ question }}" placeholder="Ask something from your notes..." required><button class="btn btn-primary" type="submit">Find answer</button></form>{% if answer %}<article class="summary-box"><h2>Answer from your notes</h2><p>{{ answer }}</p></article>{% endif %}<p class="notice">This basic version finds relevant sentences; it does not use an external AI model.</p><a class="back-link" href="{{ url_for('dashboard') }}">← Back to dashboard</a></main></body></html>
